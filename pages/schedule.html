<section class="panel-band" id="schedule">
  <div class="section-title">
    <div class="section-badge"><i data-lucide="compass" aria-hidden="true"></i> Weekly Epigraph</div>
    <h2>Release Schedule</h2>
    <p class="section-subtitle">Episode drops tracked live in your local coordinate (<span id="userTimezone">Detecting timezone...</span>).</p>
  </div>

  <div class="schedule-controls">
    <div class="timezone-chip" id="tzBadge" title="Your browser's detected local timezone">
      <i data-lucide="globe" aria-hidden="true"></i>
      <span id="detectedTz">Detecting timezone...</span>
    </div>

    <div class="schedule-sync-actions">
      <a class="sync-action-btn" href="schedule.ics" download="donghua-central.ics" title="Subscribe via Apple Calendar, Google Calendar, or Outlook">
        <i data-lucide="calendar-plus" aria-hidden="true"></i>
        <span>iCal Feed</span>
      </a>
      <a class="sync-action-btn" href="feed.xml" target="_blank" rel="noopener noreferrer" title="Subscribe via RSS feed">
        <i data-lucide="rss" aria-hidden="true"></i>
        <span>RSS Feed</span>
      </a>
    </div>
  </div>

  <div class="day-tabs-wrapper">
    <div class="day-tabs" role="tablist" aria-label="Schedule day selector" id="dayTabs">
      <!-- populated dynamically by JS: day buttons with counts and today pill -->
    </div>
  </div>

  <div class="schedule-grid" id="scheduleGrid" role="tabpanel">
    <!-- populated dynamically by JS -->
  </div>

  <div class="no-results" id="scheduleEmpty" hidden>
    <i data-lucide="moon" aria-hidden="true"></i>
    <p>No disciples releasing scrolls on this day. The realm is in secluded meditation.</p>
  </div>
</section>
