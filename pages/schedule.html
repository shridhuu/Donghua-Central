<section class="panel-band" id="schedule">
  <div class="section-title">
    <p class="eyebrow">Weekly Release Tracker</p>
    <h2>Release Schedule</h2>
    <p class="section-subtitle">When new episodes drop, tracked in your local time.</p>
  </div>

  <div class="day-tabs" role="tablist" aria-label="Schedule day selector" id="dayTabs">
    <!-- populated by JS: one button per day -->
  </div>

  <div class="schedule-grid" id="scheduleGrid" role="tabpanel">
    <!-- populated by JS -->
  </div>

  <p class="no-results" id="scheduleEmpty" hidden>Nothing scheduled for this day yet.</p>
</section>
